<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/home.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">
        <img data-company-logo hidden alt="">
        <span>
          <span class="brand-name" data-company-name>VTC</span><br>
          <span class="brand-slogan" data-company-slogan hidden></span>
        </span>
      </a>
      <nav class="site">
        <a href="/" aria-current="page">Accueil</a>
        <a href="/livraisons">Livraisons</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 data-company-name>VTC</h1>
    <p class="lead" id="description">Activité de l'entreprise, mise à jour à chaque livraison.</p>

    <section class="kpis" id="kpis" aria-label="Chiffres clés"></section>

    <h2>Dernières livraisons</h2>
    <div id="recent"></div>
    <p><a href="/livraisons">Toutes les livraisons →</a></p>

    <h2>Nos chauffeurs</h2>
    <div id="drivers"></div>
  </main>

  <footer class="site"><div class="wrap"><span data-company-name>VTC</span> · entreprise virtuelle sur Euro Truck Simulator 2</div></footer>
</body>
</html>
